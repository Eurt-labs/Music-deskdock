<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 920 580" width="100%" height="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }

      /* Visualizer & Device Animations */
      @keyframes spinRecord {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes beatGlow {
        0%, 100% { stroke: #2a1b38; stroke-width: 1.5; opacity: 0.6; }
        15% { stroke: #f81f8f; stroke-width: 3.5; opacity: 1.0; }
        35% { stroke: #ffe043; stroke-width: 2.5; opacity: 1.0; }
        60% { stroke: #2a1b38; stroke-width: 1.5; opacity: 0.6; }
      }

      @keyframes marqueeSlide {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(-260px); }
      }

      @keyframes volBarAnim {
        0%, 100% { width: 95px; fill: #00f0ff; }
        15% { width: 130px; fill: #ffd700; }
        45% { width: 80px; fill: #00f0ff; }
        70% { width: 115px; fill: #00f0ff; }
      }

      @keyframes ledBeatPulse {
        0%, 100% { fill: #103322; opacity: 0.5; }
        15% { fill: #00ff88; opacity: 1.0; }
        45% { fill: #103322; opacity: 0.5; }
      }

      @keyframes ledSyncPulse {
        0%, 100% { fill: #00f0ff; opacity: 1.0; }
        50% { fill: #0099aa; opacity: 0.7; }
      }

      @keyframes fft1 { 0%, 100% { height: 18px; y: 34px; } 50% { height: 46px; y: 6px; } }
      @keyframes fft2 { 0%, 100% { height: 42px; y: 10px; } 50% { height: 22px; y: 30px; } }
      @keyframes fft3 { 0%, 100% { height: 28px; y: 24px; } 50% { height: 48px; y: 4px; } }
      @keyframes fft4 { 0%, 100% { height: 38px; y: 14px; } 50% { height: 16px; y: 36px; } }
      @keyframes fft5 { 0%, 100% { height: 20px; y: 32px; } 50% { height: 40px; y: 12px; } }
      @keyframes fft6 { 0%, 100% { height: 32px; y: 20px; } 50% { height: 14px; y: 38px; } }

      .record-spin { transform-origin: 100px 100px; animation: spinRecord 9s linear infinite; }
      .beat-box { animation: beatGlow 1.25s ease-in-out infinite; }
      .marquee-text { animation: marqueeSlide 10s linear infinite; }
      .vol-bar { animation: volBarAnim 1.25s ease-in-out infinite; }
      .led-beat { animation: ledBeatPulse 1.25s ease-in-out infinite; }
      .led-sync { animation: ledSyncPulse 3s ease-in-out infinite; }
      /* ]]> */
    </style>

    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c202a" />
      <stop offset="100%" stop-color="#12151c" />
    </linearGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="920" height="580" rx="16" fill="url(#mainBg)" />
  <rect x="14" y="14" width="892" height="552" rx="14" fill="#12151d" stroke="#252c3b" stroke-width="1.5" />

  <!-- Top Hero Header -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" class="font-sans" font-size="16" font-weight="800" fill="#ffffff">ESP32 MUSIC DESKDOCK</text>
    <text x="210" y="0" class="font-mono" font-size="12" font-weight="600" fill="#00f0ff">• 1.8&quot; ST7735 Portrait Display (128x160) • Hardware Controller</text>
    
    <!-- Live Badges -->
    <rect x="690" y="-14" width="150" height="24" rx="5" fill="#0c2328" stroke="#00f0ff" stroke-width="1.2" />
    <circle cx="704" cy="-2" r="4" fill="#00f0ff" />
    <text x="716" y="2" class="font-mono" font-size="11" font-weight="700" fill="#00f0ff">PORTRAIT 128x160</text>
  </g>

  <line x1="36" y1="58" x2="884" y2="58" stroke="#232a38" stroke-width="1.2" />

  <!-- ================= LEFT: ESP32 HARDWARE ENCLOSURE (PORTRAIT) ================= -->
  <g transform="translate(36, 76)">
    <!-- Chassis Body -->
    <rect x="0" y="0" width="380" height="466" rx="14" fill="url(#chassisGrad)" stroke="#2f3747" stroke-width="1.5" />
    
    <!-- Header Title -->
    <text x="20" y="26" class="font-sans" font-size="12" font-weight="700" fill="#cbd5e1">ESP32 DESKDOCK HARDWARE (PORTRAIT)</text>
    
    <!-- ST7735 Portrait Display Frame (Scaled 128x160: 200 x 250 px) -->
    <rect x="90" y="42" width="200" height="250" rx="6" fill="#080a0e" stroke="#252c3b" stroke-width="2" />
    
    <!-- Active LCD Screen -->
    <g transform="translate(90, 42)">
      <!-- 1. Top 200x200 Album Artwork (Scaled from 128x128) -->
      <g clip-path="url(#chassisClip)">
        <clipPath id="chassisClip">
          <rect x="0" y="0" width="200" height="200" rx="4" />
        </clipPath>
        
        <rect x="0" y="0" width="200" height="200" fill="#0b0e14" />

        <!-- Vinyl Disc Graphic -->
        <g class="record-spin">
          <circle cx="100" cy="100" r="90" fill="#181d26" stroke="#252b37" stroke-width="2" />
          <circle cx="100" cy="100" r="76" fill="#12161e" stroke="#1d222b" stroke-width="1.2" />
          <circle cx="100" cy="100" r="62" fill="#161921" stroke="#222732" stroke-width="1.2" />
          <circle cx="100" cy="100" r="48" fill="#14171e" stroke="#1d222b" stroke-width="1.2" />
          <circle cx="100" cy="100" r="36" fill="#171b24" stroke="#242a36" stroke-width="1.2" />
          
          <!-- Vinyl Spindle Label -->
          <circle cx="100" cy="100" r="26" fill="#ffd700" stroke="#d49a18" stroke-width="1.5" />
          <circle cx="100" cy="100" r="8" fill="#080a0e" />
        </g>

        <!-- Dynamic Pulsing Beat Border -->
        <rect x="2" y="2" width="196" height="196" rx="2" fill="none" class="beat-box" />

        <!-- Resolution Tag -->
        <rect x="6" y="6" width="76" height="16" rx="3" fill="#000000" opacity="0.85" />
        <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#00f0ff">128x128 ART</text>
      </g>

      <!-- 2. Bottom 200x50 Control & Info Panel (Scaled from 128x32) -->
      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="200" height="50" fill="#181b22" />
        <line x1="0" y1="0" x2="200" y2="0" stroke="#f81f8f" stroke-width="1.5" />

        <!-- Marquee Text Strip -->
        <g clip-path="url(#chassisMarqueeClip)">
          <clipPath id="chassisMarqueeClip">
            <rect x="8" y="4" width="184" height="18" />
          </clipPath>
          <g class="marquee-text">
            <text x="8" y="16" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">The Weeknd - Blinding Lights • After Hours • The Weeknd - Blinding Lights</text>
          </g>
        </g>

        <!-- Divider line -->
        <line x1="8" y1="24" x2="192" y2="24" stroke="#084242" stroke-width="1" />

        <!-- Play Indicator (►) -->
        <polygon points="12,30 12,42 22,36" fill="#00f0ff" />

        <!-- Horizontal Volume Equalizer Bar -->
        <rect x="30" y="31" width="160" height="12" rx="2" fill="#080a0e" stroke="#ffffff" stroke-width="1" />
        <rect x="32" y="33" width="110" height="8" rx="1" class="vol-bar" />
      </g>
    </g>

    <!-- Status LEDs on Hardware Chassis -->
    <g transform="translate(30, 316)">
      <circle cx="30" cy="8" r="6" fill="#00f0ff" class="led-sync" />
      <text x="44" y="12" class="font-mono" font-size="10" fill="#00f0ff" font-weight="700">WI-FI SYNC</text>

      <circle cx="150" cy="8" r="6" fill="#00ff88" class="led-beat" />
      <text x="164" y="12" class="font-mono" font-size="10" fill="#00ff88" font-weight="700">BEAT PULSE</text>

      <circle cx="270" cy="8" r="6" fill="#4d1a1a" />
      <text x="284" y="12" class="font-mono" font-size="10" fill="#94a3b8" font-weight="600">IDLE</text>
    </g>

    <!-- Tactile Push Buttons -->
    <g transform="translate(20, 354)">
      <!-- PREVIOUS (D25) -->
      <rect x="0" y="0" width="106" height="38" rx="6" fill="#252a35" stroke="#3d4659" stroke-width="1.2" />
      <text x="22" y="20" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">⏮ PREV</text>
      <text x="32" y="32" class="font-mono" font-size="9" font-weight="600" fill="#94a3b8">GPIO 25</text>

      <!-- PLAY / PAUSE (D26) -->
      <rect x="117" y="0" width="106" height="38" rx="6" fill="#152828" stroke="#00f0ff" stroke-width="1.5" />
      <text x="139" y="20" class="font-sans" font-size="11" font-weight="700" fill="#00f0ff">⏯ PLAY</text>
      <text x="149" y="32" class="font-mono" font-size="9" font-weight="600" fill="#00f0ff">GPIO 26</text>

      <!-- NEXT (D33) -->
      <rect x="234" y="0" width="106" height="38" rx="6" fill="#252a35" stroke="#3d4659" stroke-width="1.2" />
      <text x="256" y="20" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">⏭ NEXT</text>
      <text x="266" y="32" class="font-mono" font-size="9" font-weight="600" fill="#94a3b8">GPIO 33</text>
    </g>

    <!-- Bottom Wiring Pinout Quick Info -->
    <g transform="translate(20, 412)">
      <rect x="0" y="0" width="340" height="36" rx="6" fill="#0d1016" stroke="#252c3b" stroke-width="1" />
      <text x="14" y="23" class="font-mono" font-size="10" font-weight="600" fill="#cbd5e1">VSPI: CS:D5 • RST:D4 • DC:D2 • MOSI:D23 • SCK:D18</text>
    </g>
  </g>

  <!-- ================= RIGHT: PC TRANSMITTER & TELEMETRY STREAM ================= -->
  <g transform="translate(440, 76)">
    <rect x="0" y="0" width="444" height="466" rx="14" fill="#141720" stroke="#28303f" stroke-width="1.5" />
    
    <text x="20" y="26" class="font-sans" font-size="13" font-weight="700" fill="#00f0ff">LIVE AUDIO &amp; TELEMETRY ENGINE</text>

    <!-- Real-time FFT Spectrum Card -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="408" height="126" rx="8" fill="#0c0e14" stroke="#252c3b" stroke-width="1.2" />
      <text x="16" y="22" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">WASAPI Loopback FFT Spectrum (20 Hz - 16 kHz)</text>

      <!-- Animated FFT Frequency Bars -->
      <g transform="translate(16, 40)">
        <rect x="0"   width="10" rx="1.5" fill="#f81f8f" style="animation: fft1 0.75s ease-in-out infinite;" />
        <rect x="15"  width="10" rx="1.5" fill="#f81f8f" style="animation: fft2 0.65s ease-in-out infinite;" />
        <rect x="30"  width="10" rx="1.5" fill="#ffd700" style="animation: fft3 0.85s ease-in-out infinite;" />
        <rect x="45"  width="10" rx="1.5" fill="#ffd700" style="animation: fft4 0.55s ease-in-out infinite;" />
        <rect x="60"  width="10" rx="1.5" fill="#00f0ff" style="animation: fft5 0.95s ease-in-out infinite;" />
        <rect x="75"  width="10" rx="1.5" fill="#00f0ff" style="animation: fft6 0.75s ease-in-out infinite;" />
        <rect x="90"  width="10" rx="1.5" fill="#00f0ff" style="animation: fft1 0.85s ease-in-out infinite;" />
        <rect x="105" width="10" rx="1.5" fill="#00f0ff" style="animation: fft2 0.65s ease-in-out infinite;" />
        <rect x="120" width="10" rx="1.5" fill="#00f0ff" style="animation: fft3 0.95s ease-in-out infinite;" />
        <rect x="135" width="10" rx="1.5" fill="#00f0ff" style="animation: fft4 0.75s ease-in-out infinite;" />
        <rect x="150" width="10" rx="1.5" fill="#00f0ff" style="animation: fft5 0.85s ease-in-out infinite;" />
        <rect x="165" width="10" rx="1.5" fill="#00f0ff" style="animation: fft6 1.05s ease-in-out infinite;" />
        <rect x="180" width="10" rx="1.5" fill="#00f0ff" style="animation: fft1 0.65s ease-in-out infinite;" />
        <rect x="195" width="10" rx="1.5" fill="#00f0ff" style="animation: fft2 1.15s ease-in-out infinite;" />
        <rect x="210" width="10" rx="1.5" fill="#00f0ff" style="animation: fft3 0.75s ease-in-out infinite;" />
        <rect x="225" width="10" rx="1.5" fill="#00f0ff" style="animation: fft4 0.85s ease-in-out infinite;" />
        <rect x="240" width="10" rx="1.5" fill="#00f0ff" style="animation: fft5 0.95s ease-in-out infinite;" />
        <rect x="255" width="10" rx="1.5" fill="#00f0ff" style="animation: fft6 0.75s ease-in-out infinite;" />
        <rect x="270" width="10" rx="1.5" fill="#00f0ff" style="animation: fft1 1.05s ease-in-out infinite;" />
        <rect x="285" width="10" rx="1.5" fill="#00f0ff" style="animation: fft2 0.85s ease-in-out infinite;" />
        <rect x="300" width="10" rx="1.5" fill="#00f0ff" style="animation: fft3 0.75s ease-in-out infinite;" />
        <rect x="315" width="10" rx="1.5" fill="#00f0ff" style="animation: fft4 0.95s ease-in-out infinite;" />
        <rect x="330" width="10" rx="1.5" fill="#00f0ff" style="animation: fft5 0.65s ease-in-out infinite;" />
        <rect x="345" width="10" rx="1.5" fill="#00f0ff" style="animation: fft6 0.85s ease-in-out infinite;" />
        <rect x="360" width="10" rx="1.5" fill="#00f0ff" style="animation: fft1 0.75s ease-in-out infinite;" />
      </g>
    </g>

    <!-- ================= 4 METRICS CARDS (Properly separated transforms) ================= -->
    <!-- Card 1: RMS Volume (Top-Left) -->
    <g transform="translate(18, 180)">
      <rect x="0" y="0" width="198" height="66" rx="7" fill="#0c0e14" stroke="#252c3b" stroke-width="1.2" />
      <text x="14" y="20" class="font-mono" font-size="10" font-weight="700" fill="#94a3b8">RMS VOLUME LEVEL</text>
      <text x="14" y="42" class="font-mono" font-size="16" font-weight="800" fill="#00f0ff">82 %</text>
      <text x="76" y="42" class="font-mono" font-size="11" font-weight="600" fill="#cbd5e1">-12.4 dBFS</text>
      <text x="14" y="57" class="font-mono" font-size="9" fill="#94a3b8">WASAPI Loopback Capture</text>
    </g>

    <!-- Card 2: Bass Kick (Top-Right) -->
    <g transform="translate(228, 180)">
      <rect x="0" y="0" width="198" height="66" rx="7" fill="#0c0e14" stroke="#252c3b" stroke-width="1.2" />
      <text x="14" y="20" class="font-mono" font-size="10" font-weight="700" fill="#94a3b8">BASS KICK TRIGGER</text>
      <text x="14" y="42" class="font-mono" font-size="15" font-weight="800" fill="#ffd700">BEAT DETECTED</text>
      <text x="14" y="57" class="font-mono" font-size="9" fill="#94a3b8">20 - 140 Hz Band FFT</text>
    </g>

    <!-- Card 3: UDP Telemetry (Bottom-Left) -->
    <g transform="translate(18, 256)">
      <rect x="0" y="0" width="198" height="66" rx="7" fill="#0c0e14" stroke="#252c3b" stroke-width="1.2" />
      <text x="14" y="20" class="font-mono" font-size="10" font-weight="700" fill="#94a3b8">UDP TELEMETRY</text>
      <text x="14" y="42" class="font-mono" font-size="16" font-weight="800" fill="#00f0ff">40.2 FPS</text>
      <text x="14" y="57" class="font-mono" font-size="9" fill="#cbd5e1">Port 12345 (Sub-10ms latency)</text>
    </g>

    <!-- Card 4: Cover Art HTTP (Bottom-Right) -->
    <g transform="translate(228, 256)">
      <rect x="0" y="0" width="198" height="66" rx="7" fill="#0c0e14" stroke="#252c3b" stroke-width="1.2" />
      <text x="14" y="20" class="font-mono" font-size="10" font-weight="700" fill="#94a3b8">RAW COVER ART</text>
      <text x="14" y="42" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">32.7 KB</text>
      <text x="14" y="57" class="font-mono" font-size="9" fill="#cbd5e1">Port 8080 (128x128 RGB565)</text>
    </g>

    <!-- Communication Bridge Status Card -->
    <g transform="translate(18, 334)">
      <rect x="0" y="0" width="408" height="118" rx="8" fill="#0c0e14" stroke="#252c3b" stroke-width="1.2" />
      <text x="16" y="22" class="font-sans" font-size="11" font-weight="700" fill="#00f0ff">BIDIRECTIONAL WI-FI PROTOCOL</text>
      
      <text x="16" y="46" class="font-mono" font-size="10" font-weight="600" fill="#ffffff">PC Host  ──► [UDP:12345] Vol, Beat, Title (40 FPS)</text>
      <text x="16" y="68" class="font-mono" font-size="10" font-weight="600" fill="#ffffff">PC Host  ──► [HTTP:8080] 128x128 RGB565 Bitmap</text>
      <text x="16" y="90" class="font-mono" font-size="10" font-weight="700" fill="#ffd700">ESP32    ──► [UDP:12345] Hardware Buttons (⏮ ⏯ ⏭)</text>
      <text x="16" y="108" class="font-mono" font-size="10" font-weight="600" fill="#00f0ff">Display  ──► ST7735 128x160 Double-Buffered Portrait RAM</text>
    </g>
  </g>
</svg>
