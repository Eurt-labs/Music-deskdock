<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      /* ]]> */
    </style>
  </defs>

  <!-- Container -->
  <rect width="880" height="320" rx="12" fill="#0e1016" />
  <rect x="10" y="10" width="860" height="300" rx="10" fill="#11141c" stroke="#262d3c" stroke-width="1" />

  <!-- Header -->
  <text x="30" y="38" class="font-sans" font-size="16" font-weight="700" fill="#ffffff">System Architecture</text>
  <text x="690" y="38" class="font-mono" font-size="12" font-weight="600" fill="#00f0ff">128x160 Portrait Mode</text>
  <line x1="30" y1="50" x2="850" y2="50" stroke="#1e2430" stroke-width="1" />

  <!-- 1. Windows PC Card -->
  <g transform="translate(30, 64)">
    <rect x="0" y="0" width="340" height="232" rx="8" fill="#141822" stroke="#262d3c" stroke-width="1" />
    <text x="18" y="30" class="font-sans" font-size="15" font-weight="700" fill="#00f0ff">Windows PC (audio_sender.py)</text>

    <text x="18" y="68" class="font-sans" font-size="13" fill="#e2e8f0">• WASAPI loopback: captures volume &amp; bass beat</text>
    <text x="18" y="108" class="font-sans" font-size="13" fill="#e2e8f0">• Windows Media: pulls title, artist &amp; album art</text>
    <text x="18" y="148" class="font-sans" font-size="13" fill="#ffd700">• UDP server (12345): sends telemetry &amp; receives input</text>
    <text x="18" y="188" class="font-sans" font-size="13" fill="#ffd700">• HTTP server (8080): streams raw 128x128 cover bitmap</text>
  </g>

  <!-- 2. Wi-Fi Bridge -->
  <g transform="translate(388, 64)">
    <rect x="0" y="0" width="104" height="232" rx="8" fill="#0c0e14" stroke="#262d3c" stroke-width="1" />
    <text x="32" y="30" class="font-sans" font-size="15" font-weight="700" fill="#00f0ff">Wi-Fi</text>

    <!-- UDP Down -->
    <rect x="8" y="52" width="88" height="42" rx="6" fill="#121820" stroke="#00f0ff" stroke-width="1" />
    <text x="12" y="70" class="font-mono" font-size="11" font-weight="700" fill="#00f0ff">UDP :12345</text>
    <text x="12" y="86" class="font-mono" font-size="9" fill="#ffffff">Telemetry ──►</text>

    <!-- HTTP Down -->
    <rect x="8" y="110" width="88" height="42" rx="6" fill="#1a1810" stroke="#ffd700" stroke-width="1" />
    <text x="12" y="128" class="font-mono" font-size="11" font-weight="700" fill="#ffd700">HTTP :8080</text>
    <text x="12" y="144" class="font-mono" font-size="9" fill="#ffffff">Cover Art ──►</text>

    <!-- UDP Up -->
    <rect x="8" y="168" width="88" height="42" rx="6" fill="#1c1218" stroke="#f81f8f" stroke-width="1" />
    <text x="12" y="186" class="font-mono" font-size="11" font-weight="700" fill="#f81f8f">UDP :12345</text>
    <text x="12" y="202" class="font-mono" font-size="9" fill="#ffffff">◄── Buttons</text>
  </g>

  <!-- 3. ESP32 Card -->
  <g transform="translate(510, 64)">
    <rect x="0" y="0" width="340" height="232" rx="8" fill="#141822" stroke="#262d3c" stroke-width="1" />
    <text x="18" y="30" class="font-sans" font-size="15" font-weight="700" fill="#00f0ff">ESP32 (main.cpp)</text>

    <text x="18" y="68" class="font-sans" font-size="13" fill="#e2e8f0">• 1.8&quot; ST7735 LCD: 128x160 portrait display</text>
    <text x="18" y="108" class="font-sans" font-size="13" fill="#e2e8f0">• Framebuffer: 40 KB RAM canvas (flicker-free)</text>
    <text x="18" y="148" class="font-sans" font-size="13" fill="#ffffff">• 3x Buttons: Prev (D25), Play/Pause (D26), Next (D33)</text>
    <text x="18" y="188" class="font-sans" font-size="13" fill="#ffffff">• 3x Status LEDs: Wi-Fi (D12), Beat (D14), Idle (D27)</text>
  </g>
</svg>
